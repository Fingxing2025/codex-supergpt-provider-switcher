# 仅用于说明。请运行 configure.py 生成带有正确路径的本机私有模板。
model_provider = "supergpt"
model = "gpt-6.1-sol"
model_catalog_json = "/ABSOLUTE/PATH/TO/supergpt-codex-models.json"

[model_providers.supergpt]
name = "SuperGPT"
base_url = "https://api.supergpt.dev/v1"
wire_api = "responses"
supports_websockets = false
requires_openai_auth = true
experimental_bearer_token = "REPLACE_WITH_YOUR_SUPERGPT_API_KEY"

